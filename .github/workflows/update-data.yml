name: Update daily intensity data

# Every early morning, rebuild data/daily-intensity.json so it runs up to
# yesterday, and commit it to main. The push to main makes Vercel redeploy the
# site with the new data, since the JSON is read at build time.
on:
  schedule:
    # 05:30 UTC = 05:30 UK time in winter, 06:30 in summer. GitHub can start
    # scheduled runs a little late, so this leaves time before people are up.
    - cron: "30 5 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # main is protected, so the default token can't push to it. A token
          # from an account allowed to bypass the protection is needed; see
          # "Automatic data updates" in README.md.
          token: ${{ secrets.DATA_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script only uses the standard library, so nothing to install.
      - run: python scripts/prepare_daily_intensity.py

      - name: Commit and push if the data changed
        run: |
          if git diff --quiet -- data/daily-intensity.json; then
            echo "No change to the data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-intensity.json
          git commit -m "chore(data): update daily intensity to $(date -u -d yesterday +%F)"
          git push
